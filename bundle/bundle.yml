schema_version: "1.0"

bundle:
  id: devflow
  name: DevFlow
  version: 0.4.0
  role: developer
  description: >-
    Autonomous, spec-driven development workflow: two human STOPs, a one-task-per-iteration
    build loop with maker/checker/judge verification, a documented review loopback, close-contract
    auto-commits, and a knowledge track that ends with guaranteed-populated decision records.
    Claude Code first.
  author: Jrecos
  license: MIT

integration:
  id: claude

requires:
  speckit_version: ">=0.12.0"
  tools: [git, claude]
  mcp: [semgrep]

provides:
  # ADR-0029: DevFlow depends ONLY on spec-kit core. The git.* and superspec.brainstorm behaviors
  # it used are now internalized (devflow-git.sh; the brainstorm behavior folded into the review/
  # frame prompts), so neither extension is a provided dependency anymore. git the binary stays a
  # system prerequisite (requires.tools) — the spec-kit *extension* does not.
  extensions:
    - id: devflow
      version: "0.4.0"
  presets:
    - id: devflow-plan-hardening
      version: "0.4.0"
      priority: 10
      strategy: replace   # the preset's templates ARE full lean-style replacements (provides.templates[].replaces)
  steps: []
  workflows:
    - id: devflow
      version: "0.4.0"

tags: [development, autonomous, spec-driven, verification, knowledge-base]
