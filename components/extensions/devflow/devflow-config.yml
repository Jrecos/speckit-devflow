# DevFlow configuration — copied to .specify/extensions/devflow/devflow-config.yml on install.
# Onboard (/speckit-devflow-onboard) detects and fills the commands section; hooks are inert until it does.
loop:
  iteration_factor: 2.5        # budget = ceil(open_tasks * factor); shown at STOP #1
  max_attempts_per_task: 6     # attempts before a task is parked. 6 fits the maker escalation
                               # ladder (ADR-0026): tier 0 self-corrects 3x, then one attempt per
                               # remaining tier, so the strongest maker (last tier) always acts
                               # BEFORE the park. Without a local maker the tail tiers are unused
                               # and this behaves like the old cap for practical purposes.
  time_box_hours: 4
review:
  cycles: 2                    # unroll depth of the workflow's review loopback (informational)
commands:
  lint: ""                     # e.g. "npm run lint" — required for the PostToolUse hook
  typecheck: ""                # e.g. "npx tsc --noEmit"
  test_scoped: ""              # e.g. "npm test -- --changed" — required for the Stop gate
  test_full: ""                # e.g. "npm test"
judge:
  role: cross-family-judge     # resolved by $DEVFLOW_JUDGE_CMD in your environment (never committed)
  required: true               # a verdict is required per iteration; when DEVFLOW_JUDGE_CMD is
                               # unset the role falls back to Claude — same-family, warns loudly
                               # (ADR-0018). Cross-family remains the recommended topology.
  votes: 1
checker:
  role: independent-checker
  independent: true
  model: opus                  # ADR-0031: the checker is pinned to Opus (strongest reasoning),
                               # not the session model. This is the per-task adversarial grader —
                               # the layer most likely to catch behavioral bugs a cheaper local
                               # maker introduces that thin unit tests miss. The pin lives in the
                               # subagent frontmatter (assets/claude/agents/devflow-checker.md);
                               # this key documents intent. Amends ADR-0022's model:inherit choice.
maker:
  role: local-maker            # resolved by $DEVFLOW_MAKER_CMD in your environment (never committed).
  required: false              # Claude-sufficient (ADR-0020): when DEVFLOW_MAKER_CMD is unset the
                               # caller (Claude) types the code itself — exact status quo, no warning.
  edit_format: whole-file      # ADR-0003: a weaker local maker demands whole-file writes, not diffs.
  escalation:
    order: [local, assistant, agentic, claude]   # tier ladder; the last tier "claude" = the caller
                               # types it (the maker is not invoked). The environment resolves what
                               # each role name means. Tier is derived from state.attempts (ADR-0026):
                               # attempts 0-2 -> tier 0 (3 self-corrections), 3 -> 1, 4 -> 2, >=5 -> 3.
