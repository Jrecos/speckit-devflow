schema_version: "1.0"
workflow:
  id: "devflow"
  name: "DevFlow Pipeline"
  version: "0.4.0"
  author: "Jrecos"
  description: "Frame -> Plan -> Analyze -> STOP#1 -> build loop -> Review (native while loopback) -> Verify -> STOP#2 -> reconcile -> Ship -> Capture"

requires:
  speckit_version: ">=0.12.0"
  integrations:
    any: ["claude"]

inputs:
  feature:
    type: string
    required: true
    prompt: "Describe the feature to build"
  mode:
    type: string
    default: "attended"
    enum: ["attended", "attended-step", "autonomous"]
    prompt: "Loop mode (attended | attended-step | autonomous)"
  integration:
    type: string
    default: "auto"
    prompt: "Integration ('auto' uses the project's initialized integration; DevFlow targets claude)"

# Integration wiring is load-bearing: without a per-step integration the engine's
# default_integration is None and every command step fails dispatch (verified).
steps:
  # ---------- Frame ----------
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input: { args: "{{ inputs.feature }}" }
  - id: brainstorm
    command: speckit.devflow.brainstorm     # ADR-0029: internalized (was speckit.superspec.brainstorm)
    integration: "{{ inputs.integration }}"
    input: { args: "pressure-test the spec for edge cases and contradictions" }
  - id: clarify
    command: speckit.clarify
    integration: "{{ inputs.integration }}"
    continue_on_error: true          # clarify is optional-by-outcome
    input: { args: "" }

  # ---------- Plan ----------
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input: { args: "" }
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input: { args: "" }
  - id: checklist
    command: speckit.devflow.checklist   # ADR-0029: plan-validation artifact shown at STOP #1
    integration: "{{ inputs.integration }}"
    input: { args: "" }
  - id: agent-context
    type: shell
    run: bash .specify/extensions/devflow/scripts/bash/devflow-agent-context.sh

  # ---------- Loop state + leash (feature.json exists only after specify ran) ----------
  - id: init-loop
    type: shell
    run: bash .specify/extensions/devflow/scripts/bash/devflow-init.sh {{ inputs.mode }}
  - id: compute-leash
    type: shell
    run: bash .specify/extensions/devflow/scripts/bash/devflow-compute-leash.sh

  # ---------- Analyze + STOP #1 ----------
  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input: { args: "" }
  - id: stop1
    type: gate
    message: "STOP #1 - review the plan, the failing acceptance tests, and the leash below. approve = hand the loop the keys until STOP #2 · revise = send it back to re-plan · reject = abort."
    show_file: ".specify/devflow/leash.md"
    options: [approve, revise, reject]
    on_reject: abort

  # ---------- Revise loop (ADR-0030): STOP #1 'revise' sends the plan back for another round ----------
  # The engine has no goto, but a `while` on the gate's choice is a real revision loop. Body:
  # re-plan (brainstorm..checklist) -> recompute the leash (revise regenerates tasks.md, so the old
  # budget is stale) -> re-analyze -> re-gate. The loop condition reads stop1's choice; the in-body
  # re-gate uses a distinct id (stop1-again, unique) and the condition ORs both so a fresh 'revise'
  # from either the seed or a later pass keeps the loop going; 'approve'/'reject' end it (reject
  # aborts at the gate). max_iterations caps runaway revision.
  - id: revise-loop
    type: while
    max_iterations: 5
    condition: "{{ steps.stop1.output.choice == 'revise' or steps.stop1-again.output.choice == 'revise' }}"
    steps:
      - id: revise-brainstorm
        command: speckit.devflow.brainstorm
        integration: "{{ inputs.integration }}"
        input: { args: "revise: re-pressure-test the spec given the reviewer's concerns" }
      - id: revise-clarify
        command: speckit.clarify
        integration: "{{ inputs.integration }}"
        continue_on_error: true
        input: { args: "" }
      - id: revise-plan
        command: speckit.plan
        integration: "{{ inputs.integration }}"
        input: { args: "revise the plan" }
      - id: revise-tasks
        command: speckit.tasks
        integration: "{{ inputs.integration }}"
        input: { args: "" }
      - id: revise-checklist
        command: speckit.devflow.checklist
        integration: "{{ inputs.integration }}"
        input: { args: "" }
      # revise regenerated tasks.md -> reset per-task state (regenerated ids must not inherit old
      # attempts/parked/verdicts) and recompute the leash from the new task set.
      - id: revise-reinit
        type: shell
        run: bash .specify/extensions/devflow/scripts/bash/devflow-init.sh {{ inputs.mode }} --fresh
      - id: revise-leash
        type: shell
        run: bash .specify/extensions/devflow/scripts/bash/devflow-compute-leash.sh
      - id: revise-agent-context
        type: shell
        run: bash .specify/extensions/devflow/scripts/bash/devflow-agent-context.sh
      - id: revise-analyze
        command: speckit.analyze
        integration: "{{ inputs.integration }}"
        input: { args: "" }
      - id: stop1-again
        type: gate
        message: "STOP #1 (after revision) - review the revised plan, tests, and leash. approve · revise · reject."
        show_file: ".specify/devflow/leash.md"
        options: [approve, revise, reject]
        on_reject: abort

  # The time-box clock starts AFTER approval — init stamped it before Analyze/STOP #1,
  # and a paused-then-resumed gate (the documented non-TTY flow) must not eat the box.
  - id: start-clock
    type: shell
    run: >-
      python3 -c "import json,datetime;d=json.load(open('.specify/feature.json'));p=d['feature_directory']+'/loop/state.json';s=json.load(open(p));s['started_at']=datetime.datetime.now(datetime.timezone.utc).isoformat();json.dump(s,open(p,'w'),indent=2);print('devflow clock started')"

  # ---------- Build loop ----------
  - id: build-loop
    type: do-while
    max_iterations: 50
    condition: "{{ steps.loop-status.output.data.continue }}"
    steps:
      - id: iterate
        command: speckit.devflow.iterate
        integration: "{{ inputs.integration }}"
        continue_on_error: true       # a red iteration must not fail the pipeline
        input: { args: "" }
      - id: loop-status
        type: shell
        output_format: json
        run: bash .specify/extensions/devflow/scripts/bash/devflow-loop-status.sh
      # attended-step: blocking pause at every iteration boundary. A paused nested gate
      # re-runs the loop body on resume — iterate picks the NEXT task from disk state,
      # so each resume = exactly one more iteration (the intended semantics).
      - id: step-pause
        type: if
        condition: "{{ inputs.mode == 'attended-step' }}"
        then:
          - id: step-gate
            type: gate
            message: "attended-step: iteration boundary reached (see loop status above). Continue the loop?"
            options: [continue, reject]
            on_reject: abort

  # ---------- gap-D guard (ADR-0028/FIX-4) ----------
  # The engine caps the build-loop do-while at max_iterations:50. If the leash budget exceeds 50
  # (e.g. many tasks, or escalation inflating per-task cost) the loop can exit by that cap with
  # state.continue still true and tasks NOT parked — then a plain STOP#2 accept would ship open
  # work without reconcile (gap D). Path B's v_build already refuses to complete while
  # continue!=false; Path A had no equivalent. This step forces a final loop-status that
  # clean-parks any remaining open tasks so the invariant holds in both drivers.
  - id: build-loop-backstop
    type: shell
    output_format: json
    run: bash .specify/extensions/devflow/scripts/bash/devflow-loop-status.sh --force-park

  # ---------- Review (cycle 0) ----------
  - id: review
    command: speckit.devflow.review
    integration: "{{ inputs.integration }}"
    input: { args: "" }

  # ---------- Review loopback (ADR-0028: one native `while`, was two unrolled cycles) ----------
  # The engine has a real `while` step, so the review loopback is one cyclic node capped at
  # review.cycles — not two hand-duplicated blocks. Design notes:
  # - The loop condition reads `findings-status` (the pre-loop seed). Step ids are globally unique
  #   (the validator bans duplicates across all scopes), so the seed cannot also appear in the body;
  #   the condition therefore re-evaluates against the seed each pass. That is a deliberate, BOUNDED
  #   over-run: at most review.cycles passes.
  # - It is harmless because convert-findings and the fix-loop are NO-OPS when findings are clean:
  #   convert-findings re-reads findings.json fresh and exits without appending fix-tasks; the
  #   fix-loop then finds no pickable tasks and loop-status returns tasks_exhausted immediately.
  #   So a stale extra pass does zero work — it re-reviews and exits. The trailing park-findings
  #   step (after the loop) is what actually parks any true survivors.
  - id: findings-status
    type: shell
    output_format: json
    run: python3 -c "import json;d=json.load(open('.specify/feature.json'));f=json.load(open(d['feature_directory']+'/review/findings.json'));print(json.dumps({'status':f['status']}))"
  - id: review-loop
    type: while
    max_iterations: 2   # = review.cycles: the real cap on fix cycles (ADR-0012/0028)
    condition: "{{ steps.findings-status.output.data.status == 'findings' }}"
    steps:
      - id: convert
        type: shell
        run: bash .specify/extensions/devflow/scripts/bash/devflow-convert-findings.sh
      - id: fix-loop
        type: do-while
        max_iterations: 25
        condition: "{{ steps.loop-status-f.output.data.continue }}"
        steps:
          - id: iterate-f
            command: speckit.devflow.iterate
            integration: "{{ inputs.integration }}"
            continue_on_error: true
            input: { args: "" }
          - id: loop-status-f
            type: shell
            output_format: json
            run: bash .specify/extensions/devflow/scripts/bash/devflow-loop-status.sh
          - id: step-pause-f
            type: if
            condition: "{{ inputs.mode == 'attended-step' }}"
            then:
              - id: step-gate-f
                type: gate
                message: "attended-step: fix-loop iteration boundary. Continue?"
                options: [continue, reject]
                on_reject: abort
      - id: re-review
        command: speckit.devflow.review
        integration: "{{ inputs.integration }}"
        input: { args: "full re-review" }
  # cap spent (or clean): surviving findings are parked with history (ADR-0012). Runs unconditionally
  # after the while — the engine gives no "exited by cap" signal, so re-read findings.json every time.
  - id: park-findings
    type: shell
    run: >-
      python3 -c "import json;d=json.load(open('.specify/feature.json'));p=d['feature_directory']+'/review/findings.json';f=json.load(open(p));
      f['status']='parked' if f['status']=='findings' else f['status'];json.dump(f,open(p,'w'),indent=2);print(f['status'])"

  # ---------- Verify (gap-B prerequisite, then the phase) ----------
  - id: verify-prereq
    type: shell
    run: bash .specify/extensions/devflow/scripts/bash/devflow-check-review.sh
  - id: verify
    command: speckit.devflow.verify
    integration: "{{ inputs.integration }}"
    input: { args: "" }

  # ---------- STOP #2 + routing ----------
  - id: stop2-prep
    type: shell
    run: bash .specify/extensions/devflow/scripts/bash/devflow-stop2-prep.sh
  - id: stop2
    type: gate
    message: "STOP #2 - the evidence is below. Ship happens only past this gate. Accepting with parked items routes through reconcile-contract."
    show_file: ".specify/devflow/stop2.md"
    options: [accept, accept-with-deviation, reject]
    on_reject: abort
  - id: route-stop2
    type: switch
    expression: "{{ steps.stop2.output.choice }}"
    cases:
      accept:
        # plain accept still reconciles when anything is parked (ADR-0016)
        - id: reconcile-if-parked
          type: shell
          output_format: json
          run: >-
            python3 -c "import json;d=json.load(open('.specify/feature.json'));s=json.load(open(d['feature_directory']+'/loop/state.json'));
            f=json.load(open(d['feature_directory']+'/review/findings.json'));
            print(json.dumps({'needs': bool(s['parked']) or f['status']=='parked'}))"
        - id: reconcile-parked
          type: if
          condition: "{{ steps.reconcile-if-parked.output.data.needs }}"
          then:
            - id: reconcile-a
              command: speckit.devflow.reconcile-contract
              integration: "{{ inputs.integration }}"
              input: { args: "descope: document parked tasks/findings in the contract" }
        - id: ship-a
          type: shell    # ADR-0029: internalized (was speckit.git.validate)
          run: bash .specify/extensions/devflow/scripts/bash/devflow-git.sh validate
        - id: ship-commit-a
          type: shell    # ADR-0029: internalized (was speckit.git.commit)
          run: 'bash .specify/extensions/devflow/scripts/bash/devflow-git.sh commit "devflow ship feature (accept)"'
        - id: capture-a
          command: speckit.devflow.capture
          integration: "{{ inputs.integration }}"
          input: { args: "" }
      accept-with-deviation:
        - id: reconcile-b
          command: speckit.devflow.reconcile-contract
          integration: "{{ inputs.integration }}"
          input: { args: "accepted deviation: update contract text + ADR" }
        - id: ship-b
          type: shell    # ADR-0029: internalized (was speckit.git.validate)
          run: bash .specify/extensions/devflow/scripts/bash/devflow-git.sh validate
        - id: ship-commit-b
          type: shell    # ADR-0029: internalized (was speckit.git.commit)
          run: 'bash .specify/extensions/devflow/scripts/bash/devflow-git.sh commit "devflow ship feature (accept-with-deviation)"'
        - id: capture-b
          command: speckit.devflow.capture
          integration: "{{ inputs.integration }}"
          input: { args: "" }
    default: []   # unreachable: reject aborts at the gate
